        angles: ["펀딩 성공작 중 전자책 제작작 발굴", "전자책 크클 선공개 제안", "열람 데이터로 후속작 협상"],
        links: [{label:"와디즈 삼무서점",url:"https://www.wadiz.kr/web/campaign/search?keyword=%EC%82%BC%EB%AC%B4%EC%84%9C%EC%A0%90"}]
      },
      {
        rank: 7, category: "해외", date: "9.11", title: "Audible, 연간 선결제에 ‘보유권’을 더하다",
        fact: "Premium Plus 연간 상품을 149.50달러에서 99달러로 할인하고, 12개월치 크레딧을 한 번에 지급했습니다. 받은 오디오북은 해지 후에도 보유합니다.",
        impact: "할인보다 강한 메시지는 ‘구독이 끝나도 남는 한 권’입니다. 무제한 구독의 서비스 종료·소유 불안을 보완하는 혼합 혜택으로 참고할 만합니다.",
        angles: ["연간권+전자책 소장 교환권", "종료 도서 구매 할인", "협력 출판사 1–2곳 파일럿"],
        links: [{label:"프로모션 보도",url:"https://www.sfgate.com/shopping/article/audible-premium-plus-annual-deal-22423968.php"}]

    ],
    watch: [
      { label: "M&A", title: "문학동네 인수 주체", text: "플랫폼·엔터·IT 중 누가 인수하는지와 계열사 공급 창구 변화를 관찰합니다." },
      { label: "가격", title: "KU·Kobo Plus 요금", text: "이번 주 검증 가능한 신규 변경은 없습니다. 가격·연간권·번들 변화만 추적합니다." },
      { label: "지표", title: "정기 공개일 효과", text: "알림 신청률, 알림 대비 첫 열람률, 7일 완독률을 한 세트로 비교합니다." }
    ]

];

const briefs = window.CREMA_BRIEFS || [];
const state = { week: briefs[0]?.id, filter: "전체" };
const $ = (id) => document.getElementById(id);
const categories = ["전체", "시장", "소싱", "경쟁", "가격", "프로모션", "해외"];

function linkHtml(links) {
  return links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}<span>↗</span></a>`).join("");
}

function render() {
  const brief = briefs.find(b => b.id === state.week) || briefs[0];
  if (!brief) return;
  $("updatedAt").textContent = `최근 업데이트 ${brief.updated}`;
  $("weekSummary").textContent = brief.summary;
  $("weekKeyword").textContent = brief.keyword;
  $("issueCount").textContent = brief.issues.length;
  $("sourceCount").textContent = brief.issues.filter(i => i.category === "소싱" || i.angles.some(a => /소싱|공급|출판사|작가|도서/.test(a))).length;
  $("promoCount").textContent = brief.issues.filter(i => i.category === "프로모션" || i.angles.some(a => /이벤트|푸시|리뷰|공개|프로모션|전환/.test(a))).length;

  $("actions").innerHTML = brief.actions.map((a, idx) => `
    <article class="action-card">
      <div class="action-top"><span>0${idx + 1}</span><b>${a.tag}</b></div>
      <h3>${a.title}</h3><p>${a.text}</p><div class="action-why">WHY <span>${a.why}</span></div>
    </article>`).join("");

  const visible = state.filter === "전체" ? brief.issues : brief.issues.filter(i => i.category === state.filter);
  $("issues").innerHTML = visible.map(i => `
    <article class="issue-card">
      <div class="issue-index"><span>${String(i.rank).padStart(2,"0")}</span><b>${i.category}</b><small>${i.date}</small></div>
      <div class="issue-body">
        <h3>${i.title}</h3>
        <div class="issue-copy"><div><h4>FACT</h4><p>${i.fact}</p></div><div><h4>WHY IT MATTERS</h4><p>${i.impact}</p></div></div>
        <div class="angle-row"><h4>크클 앵글</h4><ul>${i.angles.map(a=>`<li>${a}</li>`).join("")}</ul></div>
        <div class="sources">${linkHtml(i.links)}</div>
      </div>
    </article>`).join("");
  $("empty").hidden = visible.length > 0;
  $("watchList").innerHTML = brief.watch.map(w => `<article><span>${w.label}</span><h3>${w.title}</h3><p>${w.text}</p></article>`).join("");
  document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.filter === state.filter));
}

function init() {
  $("weekSelect").innerHTML = briefs.map((b, i) => `<option value="${b.id}">${b.label}${i === 0 ? " · 최신" : ""}</option>`).join("");
  $("weekSelect").addEventListener("change", e => { state.week = e.target.value; state.filter = "전체"; render(); });
  $("filters").innerHTML = categories.map(c => `<button class="filter-btn${c === "전체" ? " active" : ""}" data-filter="${c}">${c}</button>`).join("");
  $("filters").addEventListener("click", e => { const btn = e.target.closest("button"); if (!btn) return; state.filter = btn.dataset.filter; render(); });
  render();
}
init();

  </script>
</body>
