<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f3f0e8" />
  <title>READ CARD</title>
  <meta name="description" content="YES24 도서 정보를 불러와 9:16 북카드를 만드는 웹앱" />
  <link rel="stylesheet" href="./styles.css?v=1" />
</head>
<body>
  <main class="app-shell">
    <section class="editor">
      <div class="brand-row">
        <div>
          <p class="eyebrow">BOOK CARD MAKER</p>
          <h1>READ CARD</h1>
        </div>
        <span class="ratio-badge">9:16</span>
      </div>

      <div class="search-box">
        <label for="bookQuery">책 제목 또는 YES24 상품 URL</label>
        <div class="search-row">
          <input id="bookQuery" autocomplete="off" placeholder="예: 포크너 자선 단편집 1" />
          <button id="searchBtn" class="primary">불러오기</button>
        </div>
        <p id="status" class="status">책 제목을 입력하면 YES24 정보를 찾아옵니다.</p>
      </div>

      <div class="fields">
        <label>책 제목<input id="titleInput" value="포크너 자선 단편집 1" /></label>
        <label>저자명<input id="authorInput" value="윌리엄 포크너" /></label>
        <label>출판사명<input id="publisherInput" value="서커스(서커스출판상회)" /></label>
        <label>표지 URL<input id="coverInput" value="https://image.yes24.com/goods/147562506/XL" /></label>
      </div>

      <div class="actions">
        <button id="resetBtn" class="secondary">기본값</button>
        <button id="openYes24Btn" class="secondary">YES24 보기</button>
      </div>

      <div class="help">
        <p>자동 조회가 실패하면 아래 입력값을 직접 고쳐도 카드에는 즉시 반영됩니다.</p>
        <p>저자명은 YES24의 “저” 앞까지만 자동으로 정리하고, 그 아래에는 출판사명을 표시합니다.</p>
      </div>
    </section>

    <section class="preview-area" aria-label="카드 미리보기">
      <div class="phone-stage">
        <article id="readCard" class="read-card">
          <div class="card-head">
            <p id="cardTitle">포크너 자선 단편집 1</p>
            <span>READ</span>
          </div>

          <div class="cover-frame">
            <img id="cardCover" src="https://image.yes24.com/goods/147562506/XL" alt="책 표지" />
          </div>

          <div class="card-meta">
            <p class="meta-kicker">WRITTEN BY</p>
            <h2 id="cardAuthor">윌리엄 포크너</h2>
            <p id="cardPublisher">서커스(서커스출판상회)</p>
          </div>

          <div class="card-foot">
            <span>READ CARD</span>
            <span id="cardDate"></span>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="./app.js?v=1"></script>
</body>
</html>
